<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <!-- Balajee Text Gradient -->
    <linearGradient id="balajeeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="45%" stop-color="#FF7B00" />
      <stop offset="100%" stop-color="#E8590C" />
    </linearGradient>

    <!-- Outer Arch Gradient -->
    <linearGradient id="archGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Sky Backdrop Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEED4" />
      <stop offset="60%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Temple Gold Gradient -->
    <linearGradient id="templeGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Road Highway Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081830" />
      <stop offset="50%" stop-color="#0E2A54" />
      <stop offset="100%" stop-color="#1B3F73" />
    </linearGradient>

    <!-- Car Body Metallic Gradient -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Car Windshield Gradient -->
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Drop Shadow for Sharp Elements -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A1931" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ==================== LEFT EMBLEM GRAPHIC ==================== -->
  <g transform="translate(10, 0)">
    <!-- Outer Golden Circular Arc -->
    <path d="M 80,260 A 155,155 0 0,1 385,255" fill="none" stroke="url(#archGrad)" stroke-width="22" stroke-linecap="round" />
    <!-- Outer Blue Swoosh Edge -->
    <path d="M 52,285 C 90,265 140,245 200,242" fill="none" stroke="#0F294D" stroke-width="8" stroke-linecap="round" />

    <!-- Sky Background Silhouette Circle Clip -->
    <g>
      <!-- Sun Disc -->
      <circle cx="345" cy="140" r="28" fill="url(#sunGrad)" opacity="0.9" />

      <!-- Mountain Silhouettes -->
      <path d="M 270,225 L 315,160 L 360,225 Z" fill="#3B82F6" opacity="0.35" />
      <path d="M 330,225 L 375,175 L 420,225 Z" fill="#1D4ED8" opacity="0.25" />

      <!-- Flying Birds -->
      <path d="M 278,95 Q 284,88 290,95 Q 296,88 302,95 Q 295,92 278,95 Z" fill="#0F294D" />
      <path d="M 296,115 Q 301,109 306,115 Q 311,109 316,115 Q 310,113 296,115 Z" fill="#0F294D" />
    </g>

    <!-- Temple Gopuram / Tower Structure -->
    <g transform="translate(155, 52)">
      <!-- Temple Golden Spire / Kalash Top -->
      <path d="M 50,0 C 53,7 55,14 55,20 C 55,25 45,25 45,20 C 45,14 47,7 50,0 Z" fill="url(#templeGold)" />
      <circle cx="50" cy="5" r="4" fill="#FEF08A" />
      <ellipse cx="50" cy="22" rx="14" ry="6" fill="url(#templeGold)" />

      <!-- Temple Main Dome / Cupola -->
      <path d="M 32,26 C 32,20 68,20 68,26 L 74,44 C 74,47 26,47 26,44 Z" fill="url(#templeGold)" />
      <!-- Cornice -->
      <rect x="22" y="44" width="56" height="7" rx="3.5" fill="#B45309" />
      <rect x="20" y="48" width="60" height="4" rx="2" fill="#FBBF24" />

      <!-- Temple Tower Tier 1 (Navy Blue Stone) -->
      <path d="M 22,52 L 20,85 L 80,85 L 78,52 Z" fill="#0F294D" />
      <rect x="18" y="85" width="64" height="6" rx="2" fill="#CA8A04" />

      <!-- Temple Tower Tier 2 (Navy Blue Stone) -->
      <path d="M 18,91 L 14,135 L 86,135 L 82,91 Z" fill="#0A1F3D" />

      <!-- Left Small Side Gopuram Shrines -->
      <path d="M -22,125 C -22,112 -12,105 -12,105 C -12,105 -2,112 -2,125 Z" fill="#1E3A8A" opacity="0.85" />
      <rect x="-24" y="125" width="24" height="30" fill="#172554" opacity="0.85" />

      <!-- Sacred Tirupati Balaji Namam / Tilak Emblem on Temple Front -->
      <g transform="translate(50, 98)">
        <!-- Outer White "U" Shape -->
        <path d="M -16,-28 C -16,-6 -9,16 0,22 C 9,16 16,-6 16,-28 L 8,-28 C 8,-2 5,12 0,15 C -5,12 -8,-2 -8,-28 Z" fill="#FFFFFF" filter="url(#softShadow)" />
        <!-- Inner Red Crimson Flame / Center Tilak Line -->
        <path d="M -2.5,-32 C -2.5,-32 0,-36 2.5,-32 L 2.5,14 L -2.5,14 Z" fill="#DC2626" />
        <!-- Golden Base Ornament -->
        <path d="M -6,22 C -6,27 6,27 6,22 C 3,25 -3,25 -6,22 Z" fill="#F59E0B" />
      </g>
    </g>

    <!-- Curving Highway Road in Dynamic Perspective -->
    <g>
      <!-- Road Outer Navy Swoop -->
      <path d="M 40,295 C 100,240 180,210 320,240 C 370,250 405,275 410,290 C 330,340 160,355 40,295 Z" fill="url(#roadGrad)" />
      <!-- Road Bottom Accent Highlight (Yellow & Cyan Ribbons) -->
      <path d="M 50,305 C 150,345 280,335 375,292" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
      <path d="M 68,318 C 150,350 250,344 330,314" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />

      <!-- Dashed White Center Line on Highway -->
      <path d="M 80,285 C 120,265 170,248 230,245 C 280,243 320,255 350,270" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14,12" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- Modern White Touring Cab / MPV (Innova / Ertiga) -->
    <g transform="translate(170, 185)" filter="url(#softShadow)">
      <!-- Car Shadow on Road -->
      <ellipse cx="115" cy="120" rx="112" ry="14" fill="#000000" opacity="0.45" />

      <!-- Car Rear Body Perspective -->
      <path d="M 15,30 C 25,20 60,15 95,15 L 145,22 C 165,25 200,42 215,62 L 225,85 C 228,95 220,105 210,108 L 195,110 C 190,95 175,85 160,85 C 145,85 130,95 125,110 L 45,110 C 40,95 25,85 10,85 C -2,85 -10,95 -10,105 L 15,30 Z" fill="#E2E8F0" opacity="0.3" />

      <!-- Car Main Body Profile & Front 3/4 View -->
      <!-- Roof & Side Pillars -->
      <path d="M 32,25 C 45,16 75,12 110,12 C 145,12 180,22 195,38 L 210,65 L 140,60 L 32,25 Z" fill="#F8FAFC" />

      <!-- Tinted Windows (Side & Windshield) -->
      <!-- Rear Side Window -->
      <path d="M 38,27 L 72,25 L 72,48 L 38,45 Z" fill="url(#carGlass)" />
      <!-- Middle Side Window -->
      <path d="M 76,25 L 122,23 L 122,50 L 76,49 Z" fill="url(#carGlass)" />
      <!-- Front Windshield & Front Side Glass -->
      <path d="M 126,23 L 188,36 L 202,62 L 126,52 Z" fill="url(#carGlass)" />

      <!-- Window Highlights -->
      <path d="M 132,26 L 180,38" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" opacity="0.7" />

      <!-- Car Lower Body & Front Fascia (White Metallic) -->
      <path d="M 22,50 C 35,48 80,48 135,52 C 185,55 215,66 226,75 C 232,80 234,88 230,95 L 224,102 C 220,106 208,107 195,107 C 192,92 178,82 162,82 C 146,82 132,92 128,107 L 50,107 C 46,92 32,82 16,82 C 2,82 -10,94 -10,106 L 15,58 Z" fill="url(#carBody)" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Front Bonnet / Hood Character Lines -->
      <path d="M 145,55 C 170,58 198,68 215,74" fill="none" stroke="#94A3B8" stroke-width="2" />
      <path d="M 130,53 L 205,68" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- Front Headlight (Right - prominent) -->
      <polygon points="198,72 226,76 220,86 195,80" fill="#E0F2FE" stroke="#38BDF8" stroke-width="1.5" />
      <polygon points="202,74 220,77 216,83 200,79" fill="#FFFFFF" />

      <!-- Front Headlight (Left - perspective edge) -->
      <polygon points="145,64 165,66 160,72 143,69" fill="#E0F2FE" opacity="0.9" />

      <!-- Front Radiator Grille -->
      <path d="M 180,82 L 224,87 C 224,93 220,98 215,99 L 182,95 Z" fill="#0F172A" />
      <!-- Chrome Grille Accents & Emblem -->
      <line x1="185" y1="86" x2="220" y2="90" stroke="#94A3B8" stroke-width="1.5" />
      <line x1="186" y1="91" x2="216" y2="94" stroke="#64748B" stroke-width="1.2" />
      <ellipse cx="202" cy="89" rx="4" ry="2.5" fill="#E2E8F0" />

      <!-- Front Yellow Commercial Registration Plate -->
      <rect x="194" y="96" width="22" height="8" rx="1.5" fill="#FACC15" stroke="#CA8A04" stroke-width="0.8" />
      <rect x="197" y="98" width="16" height="4" fill="#854D0E" opacity="0.35" />

      <!-- Lower Bumper & Fog Lamp Accents -->
      <path d="M 175,98 L 228,102 C 228,105 222,108 215,108 L 176,104 Z" fill="#334155" />
      <circle cx="220" cy="103" r="2" fill="#FEF08A" />

      <!-- Rear Tire & Alloy Rim -->
      <ellipse cx="16" cy="104" rx="15" ry="15" fill="#0F172A" />
      <ellipse cx="16" cy="104" rx="9" ry="9" fill="#64748B" />
      <circle cx="16" cy="104" r="4" fill="#94A3B8" />

      <!-- Front Tire & Alloy Rim -->
      <ellipse cx="162" cy="104" rx="16" ry="16" fill="#0F172A" />
      <ellipse cx="162" cy="104" rx="10" ry="10" fill="#64748B" />
      <circle cx="162" cy="104" r="4" fill="#94A3B8" />
      <!-- Wheel Spokes -->
      <line x1="162" y1="95" x2="162" y2="113" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="153" y1="104" x2="171" y2="104" stroke="#CBD5E1" stroke-width="1.5" />

      <!-- Side Door Creases & Handle -->
      <line x1="75" y1="52" x2="70" y2="98" stroke="#CBD5E1" stroke-width="1" />
      <line x1="125" y1="54" x2="122" y2="98" stroke="#CBD5E1" stroke-width="1" />
      <rect x="80" y="58" width="10" height="3" rx="1.5" fill="#94A3B8" />
      <rect x="132" y="60" width="10" height="3" rx="1.5" fill="#94A3B8" />
    </g>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY SECTION ==================== -->
  <g transform="translate(425, 30)">
    <!-- Main Title: Shree (Navy) + Balajee (Gold/Amber Gradient) -->
    <g transform="translate(0, 185)">
      <!-- "Shree" Text in Navy Blue -->
      <text x="0" y="0" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="124" fill="#0D254C" letter-spacing="-0.03em">Shree</text>

      <!-- "Balajee" Text in Golden-Orange Sunset Gradient -->
      <text x="355" y="0" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="124" fill="url(#balajeeGold)" letter-spacing="-0.03em">Balajee</text>

      <!-- Sacred Crown / Diadem Motif over "Balajee" (above the letter 'j' and 'e') -->
      <g transform="translate(605, -135)">
        <!-- Golden Base Arc / Ring -->
        <path d="M -22,18 C -12,24 12,24 22,18 C 12,28 -12,28 -22,18 Z" fill="#F59E0B" />
        <!-- Left Golden Wing / Petal -->
        <path d="M -22,18 C -26,-2 -14,-14 -10,-12 C -12,-2 -16,8 -14,16 Z" fill="#F59E0B" />
        <!-- Right Golden Wing / Petal -->
        <path d="M 22,18 C 26,-2 14,-14 10,-12 C 12,-2 16,8 14,16 Z" fill="#F59E0B" />
        <!-- Central Auspicious Ruby Tilak / Flame -->
        <path d="M 0,-26 C 5,-14 7,-2 6,18 C 2,20 -2,20 -6,18 C -7,-2 -5,-14 0,-26 Z" fill="#DC2626" />
      </g>
    </g>

    <!-- Horizontal Divider with "T R A V E L S" -->
    <g transform="translate(0, 240)">
      <!-- Left Golden Accent Line -->
      <line x1="0" y1="-8" x2="160" y2="-8" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />

      <!-- Center Word: "T R A V E L S" in Navy Blue with wide tracking -->
      <text x="365" y="0" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="44" fill="#0D254C" letter-spacing="0.32em" text-anchor="middle">TRAVELS</text>

      <!-- Right Golden Accent Line -->
      <line x1="570" y1="-8" x2="720" y2="-8" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" />
    </g>

    <!-- Tagline: "SAFE JOURNEY  •  COMFORTABLE RIDES  •  EVERY DESTINATION" -->
    <g transform="translate(360, 290)">
      <text text-anchor="middle" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#0D254C" letter-spacing="0.22em">
        SAFE JOURNEY<tspan fill="#F59E0B" font-size="24" dx="18" dy="-1"> • </tspan><tspan fill="#0D254C" dx="18" dy="1">COMFORTABLE RIDES</tspan><tspan fill="#F59E0B" font-size="24" dx="18" dy="-1"> • </tspan><tspan fill="#0D254C" dx="18" dy="1">EVERY DESTINATION</tspan>
      </text>
    </g>
  </g>
</svg>
